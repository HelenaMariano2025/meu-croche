<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#512c20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Corpo da calculadora -->
  <rect x="10" y="6" width="28" height="36" rx="3"/>
  <!-- Visor -->
  <rect x="14" y="10" width="20" height="8" rx="1.5" fill="#e9ddd8" stroke="none"/>
  <line x1="30" y1="15" x2="30.5" y2="15" stroke="#a94f24" stroke-width="2"/>
  <!-- Grade de botões -->
  <rect x="14" y="22" width="6" height="4.5" rx="1"/>
  <rect x="21" y="22" width="6" height="4.5" rx="1"/>
  <rect x="28" y="22" width="6" height="4.5" rx="1"/>
  <rect x="14" y="29" width="6" height="4.5" rx="1"/>
  <rect x="21" y="29" width="6" height="4.5" rx="1"/>
  <rect x="28" y="29" width="6" height="4.5" rx="1" fill="#a94f24" fill-opacity="0.15"/>
  <!-- Símbolo = no botão direito inferior -->
  <line x1="30" y1="31" x2="34" y2="31"/>
  <line x1="30" y1="33" x2="34" y2="33"/>
</svg>
